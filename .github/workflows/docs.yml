name: Documentation

# Builds one mdBook per plugin (docs/<plugin>/) and the landing page (docs/index.html)
# into site/, and publishes it to GitHub Pages on a push to master.
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.

on:
  pull_request:
    paths:
      - 'docs/**'
      - '.claude-plugin/**'
      - 'scripts/docs-check'
      - 'Makefile'
      - '.github/workflows/docs.yml'
  push:
    branches:
      - master
    paths:
      - 'docs/**'
      - '.claude-plugin/**'
      - 'scripts/docs-check'
      - 'Makefile'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  MDBOOK_VERSION: v0.5.4
  MDBOOK_SHA256: 3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Docs check (a book per plugin, landing page links, relative links)
        run: scripts/docs-check

      - name: Install mdBook (pinned, checksum verified)
        run: |
          url="https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VERSION}/mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSL -o mdbook.tar.gz "$url"
          echo "${MDBOOK_SHA256}  mdbook.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf mdbook.tar.gz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build every book and the landing page
        run: make docs-build

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: check-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
